<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Tracker</title>

<!-- The two hand-drawn fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />

<style>
  /* ---------------------------------------------------------------
     COLORS — change these in one place and the whole app updates.
  ---------------------------------------------------------------- */
  :root {
    --ink:      #2b2b28;   /* main text / borders */
    --ink-soft: #6f6e66;   /* greyed-out secondary text */
    --paper:    #f7f5ef;   /* the "sheet" background */
    --done:     #3f8f5b;   /* green: completed things */
    --due:      #cf8a16;   /* amber: due-soon / overdue warnings */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(120% 120% at 50% 0%, #fbfaf5 0%, #f1efe7 100%);
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 20px;
  }

  /* The wobbly "hand-drawn" border look (uneven corner radii) */
  .sketch {
    border: 2.6px solid var(--ink);
    border-radius: 255px 14px 225px 16px / 16px 225px 18px 255px;
  }

  /* The whole paper sheet: sidebar | divider | list */
  .sheet {
    width: min(1000px, 100%);
    min-height: 620px;
    background: var(--paper);
    display: grid;
    grid-template-columns: 280px 8px 1fr;
    box-shadow: 7px 9px 0 rgba(43,43,40,0.10);
    overflow: hidden;
  }

  .pane-title {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 30px;
    margin: 0;
  }

  /* ---- LEFT: add-a-task sidebar ---- */
  .sidebar { padding: 30px 26px; display: flex; flex-direction: column; }
  .add-form { margin-top: 22px; display: flex; flex-direction: column; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .lbl { font-size: 16px; color: var(--ink-soft); }

  .ink-input {
    font-family: 'Patrick Hand', cursive;
    font-size: 19px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2.2px dashed #c7c4b8;
    padding: 4px 2px 6px;
    outline: none;
    width: 100%;
  }
  .ink-input::placeholder { color: #b4b1a6; }
  .ink-input:focus { border-bottom-color: var(--ink); border-bottom-style: solid; }
  input[type="date"].ink-input { font-size: 17px; color: var(--ink-soft); }

  .eta-preview { font-family: 'Caveat', cursive; font-size: 19px; color: var(--ink-soft); }

  .add-btn {
    margin-top: 4px;
    align-self: flex-start;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 22px;
    padding: 9px 16px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(43,43,40,0.18);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .add-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(43,43,40,0.18); }

  .hint { margin-top: auto; padding-top: 24px; font-size: 15px; color: var(--ink-soft); line-height: 1.45; }

  /* ---- MIDDLE: the wobbly divider line ---- */
  .divider svg { width: 8px; height: 100%; display: block; }

  /* ---- RIGHT: the task list ---- */
  .list-pane { padding: 30px; display: flex; flex-direction: column; }
  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .counts { font-size: 16px; color: var(--ink-soft); }
  .counts b { font-weight: bold; }
  .counts .dot { margin: 0 7px; color: #c2bfb4; }

  .task-list { list-style: none; margin: 0; padding: 0; }

  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 4px;
    border-bottom: 2px dotted #ddd9cc;
  }
  .task:last-child { border-bottom: none; }
  .task-body { flex: 1; min-width: 0; position: relative; }
  .task-name { font-size: 21px; }
  .task-meta { font-size: 16px; color: var(--ink-soft); margin-left: 4px; }
  .m-due.soon, .m-due.over { font-weight: bold; color: var(--due); }

  /* Completed task styling: faded + a drawn line through it */
  .task.done .task-name, .task.done .task-meta { color: var(--ink-soft); }
  .task.done .task-body::after {
    content: "";
    position: absolute;
    left: -2px; right: -2px;
    top: 52%;
    height: 2.6px;
    background: var(--done);
    transform: rotate(-.7deg);
    border-radius: 2px;
  }

  .stamp {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--done);
    transform: rotate(-3deg);
    white-space: nowrap;
  }

  /* Hand-drawn checkbox button */
  .checkbox {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    padding: 0;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform .1s ease;
  }
  .checkbox:hover { transform: scale(1.08) rotate(-2deg); }
  .checkbox:active { transform: scale(.92); }
  .checkbox svg { width: 22px; height: 22px; }

  .trash-btn {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    padding: 3px;
    background: transparent; border: none;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s ease, transform .1s ease;
    display: grid; place-items: center;
  }
  .trash-btn svg { width: 20px; height: 20px; }
  .task:hover .trash-btn { opacity: .45; }
  .trash-btn:hover { opacity: 1; transform: scale(1.12) rotate(-3deg); }

  .empty { padding: 28px 4px; font-size: 18px; color: var(--ink-soft); }

  /* "completed" separator label */
  .group-sep {
    list-style: none;
    margin: 18px 0 6px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 1px;
    color: var(--ink-soft);
    border-bottom: 2px solid var(--done);
    padding-bottom: 2px;
  }

  /* Stack into one column on narrow screens / phones */
  @media (max-width: 700px) {
    .sheet { grid-template-columns: 1fr; min-height: 0; }
    .divider { display: none; }
    .sidebar { border-bottom: 2.4px solid var(--ink); }
  }
</style>
</head>

<body>
  <div class="stage">
    <div class="sheet sketch">

      <!-- LEFT: add a task -->
      <aside class="sidebar">
        <h1 class="pane-title">new task</h1>
        <form class="add-form" id="add-form">
          <label class="field">
            <span class="lbl">what needs doing?</span>
            <input class="ink-input" id="name-input" placeholder="task name…" autocomplete="off" />
          </label>
          <label class="field">
            <span class="lbl">deadline</span>
            <input class="ink-input" id="date-input" type="date" />
            <span class="eta-preview" id="eta-preview">eta is calculated from today</span>
          </label>
          <button class="add-btn sketch" type="submit">+ add task</button>
        </form>
        <p class="hint">tip — tick the box on the right to mark a task done. it'll drop into "completed" below.</p>
      </aside>

      <!-- MIDDLE: wobbly divider -->
      <div class="divider" aria-hidden="true">
        <svg viewBox="0 0 8 600" preserveAspectRatio="none">
          <path d="M4 4 C 2 150, 6 300, 3 450 S 5 560, 4 596"
                fill="none" stroke="#2b2b28" stroke-width="2.4" stroke-linecap="round" />
        </svg>
      </div>

      <!-- RIGHT: the list -->
      <section class="list-pane">
        <header class="list-head">
          <h2 class="pane-title">tasks</h2>
          <span class="counts" id="counts"></span>
        </header>
        <ul class="task-list" id="task-list"></ul>
      </section>

    </div>
  </div>

<script>
/* ===================================================================
   TASK TRACKER  —  plain HTML/CSS/JS, no framework.

   How it works (read this top to bottom):
   1. `tasks` is one array — the single source of truth.
   2. Any change (add / toggle / delete) edits that array,
      calls save(), then calls render() to redraw the screen.
   3. render() rebuilds the list from the array every time.

   That "change array -> save -> redraw" loop is the whole app.
=================================================================== */

const STORE_KEY = 'task-tracker.tasks';

// Load saved tasks on startup. Wrapped in try/catch so it never
// crashes if storage is unavailable (e.g. a sandboxed preview).
function load() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY)) || [];
  } catch (e) {
    return [];
  }
}

// Save the current tasks array to the browser.
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(tasks));
  } catch (e) {
    /* ignore — app still works for this session, just won't persist */
  }
}

let tasks = load();
let seq = 0; // tracks the order things were completed in

// ---- date helpers -------------------------------------------------
const pad = (n) => String(n).padStart(2, '0');

// whole days from today until the deadline (negative = overdue)
function daysUntil(iso) {
  if (!iso) return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const target = new Date(iso + 'T00:00:00');
  return Math.round((target - now) / 86400000);
}

// turn a deadline into a friendly ETA like "3 days" or "~2 months"
function etaText(iso) {
  const d = daysUntil(iso);
  if (d === null || d < 0) return 'past due date';
  if (d === 0) return 'today';
  if (d === 1) return '1 day';
  if (d < 45) return d + ' days';
  const months = Math.round(d / 30);
  return '~' + months + ' month' + (months > 1 ? 's' : '');
}

// the "due ..." text shown on each task
function dueText(iso) {
  const d = daysUntil(iso);
  if (d === null) return '';
  if (d < 0) return 'overdue ' + Math.abs(d) + 'd';
  if (d === 0) return 'due today';
  const dt = new Date(iso + 'T00:00:00');
  return 'due ' + pad(dt.getDate()) + '/' + pad(dt.getMonth() + 1);
}

// stop typed task names from breaking the HTML
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---- the three actions --------------------------------------------
function addTask(name, deadline) {
  tasks.push({
    id: Date.now() + '' + Math.floor(Math.random() * 1000),
    name: name,
    deadline: deadline,   // "" if none
    done: false,
    seq: 0,
  });
  save();
  render();
}

function toggleTask(id) {
  const t = tasks.find((t) => t.id === id);
  if (!t) return;
  t.done = !t.done;
  t.seq = t.done ? ++seq : 0; // remember completion order
  save();
  render();
}

function deleteTask(id) {
  tasks = tasks.filter((t) => t.id !== id);
  save();
  render();
}
function deleteActiveTasks() {
  tasks = tasks.filter((t) => t.done);
  save();
  render();
}

// ---- drawing the screen -------------------------------------------
const listEl   = document.getElementById('task-list');
const countsEl = document.getElementById('counts');

// HTML for a single task row
function taskRowHTML(t) {
  const d = daysUntil(t.deadline);
  const soon = !t.done && d !== null && d >= 0 && d <= 2;
  const over = !t.done && d !== null && d < 0;
  const eta  = t.done ? '' : etaText(t.deadline);

  const check = t.done
    ? '<path d="M4 13 C 7 16, 9 18, 10 19 C 13 13, 17 7, 21 4" fill="none" stroke="#3f8f5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
    : '';

  return (
    '<li class="task ' + (t.done ? 'done' : '') + '">' +
      '<div class="task-body">' +
        '<span class="task-name">' + escapeHtml(t.name) + '</span>' +
        '<span class="task-meta">' +
          (eta ? ' · eta ' + eta : '') +
          (t.deadline ? ' · <span class="m-due ' + (soon ? 'soon' : '') + (over ? 'over' : '') + '">' + dueText(t.deadline) + '</span>' : '') +
        '</span>' +
      '</div>' +
      (t.done ? '<span class="stamp">COMPLETE</span>' : '') +
      '<button class="trash-btn" data-action="delete" data-id="' + t.id + '" title="delete">' +
        '<svg viewBox="0 0 24 24"><path d="M4 6 H20 M9 6 V4 H15 V6 M6 6 L7 20 H17 L18 6" fill="none" stroke="#2b2b28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</button>' +
      '<button class="checkbox sketch" data-action="toggle" data-id="' + t.id + '" style="' + (t.done ? 'border-color:#3f8f5b' : '') + '">' +
        '<svg viewBox="0 0 24 24">' + check + '</svg>' +
      '</button>' +
    '</li>'
  );
}

function render() {
  // split into active vs done
  const active = tasks.filter((t) => !t.done);
  const done   = tasks.filter((t) => t.done);

  // active tasks: soonest deadline first (no-deadline tasks last)
  active.sort((a, b) => {
    const da = daysUntil(a.deadline), db = daysUntil(b.deadline);
    if (da === null) return db === null ? 0 : 1;
    if (db === null) return -1;
    return da - db;
  });
  // done tasks: most recently completed first
  done.sort((a, b) => b.seq - a.seq);

  // keep `seq` ahead of anything already saved
  done.forEach((t) => { if (t.seq > seq) seq = t.seq; });

  let html = '';
  if (tasks.length === 0) {
    html = '<li class="empty">nothing here yet — add a task on the left.</li>';
  } else {
    html += active.map(taskRowHTML).join('');
    if (done.length) html += '<li class="group-sep">completed</li>';
    html += done.map(taskRowHTML).join('');
  }
  listEl.innerHTML = html;

  countsEl.innerHTML =
    '<b>' + active.length + '</b> active <span class="dot">·</span> ' +
    '<b style="color:#3f8f5b">' + done.length + '</b> done';
}

// ---- wiring up the buttons & form ---------------------------------

// One click listener for the whole list (works for every row,
// even ones added later). This is called "event delegation".
listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === 'toggle') toggleTask(id);
  if (btn.dataset.action === 'delete') deleteTask(id);
});

// live ETA preview while picking a date
const nameInput = document.getElementById('name-input');
const dateInput = document.getElementById('date-input');
const etaPrev   = document.getElementById('eta-preview');
dateInput.addEventListener('change', () => {
  etaPrev.textContent = dateInput.value
    ? 'eta — ' + (etaText(dateInput.value) || 'past date')
    : 'eta is calculated from today';
});

// add-task form
document.getElementById('add-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  addTask(name, dateInput.value || '');
  nameInput.value = '';
  dateInput.value = '';
  etaPrev.textContent = 'eta is calculated from today';
  nameInput.focus();
});

// first paint
render();
</script>
</body>
</html>
