<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Task Tracker — mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:      #2b2b28;
    --ink-soft: #6f6e66;
    --paper:    #f7f5ef;
    --done:     #3f8f5b;
    --due:      #cf8a16;
    --line:     #ddd9cc;
    --dash:     #c7c4b8;
    --tabbar-h: 70px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(120% 120% at 50% 0%, #fbfaf5 0%, #f1efe7 100%);
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  .sketch {
    border: 2.4px solid var(--ink);
    border-radius: 255px 14px 225px 16px / 16px 225px 18px 255px;
  }

  /* ---------- app shell ---------- */
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
  }
  .pages {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .pages::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
  }

  .page-head {
    flex: none;
    padding: 16px 18px 10px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  .page-title {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 38px;
    margin: 0;
    line-height: .95;
  }
  .counts { font-size: 16px; color: var(--ink-soft); white-space: nowrap; padding-bottom: 4px; }
  .counts b { font-weight: bold; }
  .counts .dot { margin: 0 6px; color: #c2bfb4; }

  .page-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    padding: 4px 18px 14px;
  }
  .page-scroll::-webkit-scrollbar { width: 0; }

  /* ---------- sticky bottom input bar ---------- */
  .page-bar {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 11px 14px 13px;
    background: var(--paper);
    border-top: 2.6px solid var(--ink);
  }
  .bar-hint {
    font-family: 'Caveat', cursive;
    font-size: 17px;
    color: var(--due);
    padding: 0 2px;
    min-height: 0;
    display: none;
  }
  .bar-hint.show { display: block; }
  .bar-form { display: flex; align-items: center; gap: 9px; }

  .bar-input {
    flex: 1;
    min-width: 0;
    font-family: 'Patrick Hand', cursive;
    font-size: 19px;
    color: var(--ink);
    background: transparent;
    border: 2.2px solid var(--ink);
    border-radius: 255px 12px 225px 14px / 14px 225px 14px 255px;
    padding: 10px 14px;
    outline: none;
    min-height: 46px;
  }
  .bar-input::placeholder { color: #b4b1a6; }
  .bar-input:focus { box-shadow: 2px 2px 0 rgba(43,43,40,0.12); }

  .icon-btn {
    flex: none;
    width: 46px; height: 46px;
    padding: 0;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    position: relative;
    transition: transform .1s ease;
    pointer-events: none;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn .stroke { stroke: var(--ink); }
  .icon-btn.set { background: #f6ecd6; }
  .icon-btn.set .stroke { stroke: var(--due); }
  .date-dot {
    position: absolute;
    top: 5px; right: 6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--due);
    display: none;
  }
  .icon-btn.set .date-dot { display: block; }

  /* native date input overlaid on the icon — reliable tap target on mobile */
  .date-wrap { position: relative; flex: none; width: 46px; height: 46px; }
  .date-overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    border: none;
    background: transparent;
    opacity: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    z-index: 2;
  }
  .date-overlay::-webkit-calendar-picker-indicator {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    margin: 0;
    cursor: pointer;
    opacity: 0;
  }
  .date-wrap:active .icon-btn { transform: scale(.9); }

  .plus-btn {
    flex: none;
    width: 46px; height: 46px;
    padding: 0;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 3px 3px 0 rgba(43,43,40,0.18);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .plus-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(43,43,40,0.18); }
  .plus-btn span { transform: translateY(-2px); }

  /* ---------- task list ---------- */
  .task-list { list-style: none; margin: 4px 0 0; padding: 0; }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 2px;
    border-bottom: 2px dotted var(--line);
  }
  .task:last-child { border-bottom: none; }
  .task-body { flex: 1; min-width: 0; position: relative; }
  .task-name { font-size: 22px; word-break: break-word; position: relative; display: inline-block; }
  .task-meta { font-size: 16px; color: var(--ink-soft); display: block; margin-top: 2px; }
  .m-due.soon, .m-due.over { font-weight: bold; color: var(--due); }
  .task.done .task-name, .task.done .task-meta { color: var(--ink-soft); }
  .task.done .task-name::after {
    content: "";
    position: absolute;
    left: -2px; right: -2px;
    top: 14px;
    height: 2.6px;
    background: var(--done);
    transform: rotate(-.7deg);
    border-radius: 2px;
    width: 100%;
  }
  .stamp {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 1.5px;
    color: var(--done);
    transform: rotate(-3deg);
    white-space: nowrap;
  }
  .checkbox {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    padding: 0;
    background: transparent;
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .1s ease;
  }
  .checkbox:active { transform: scale(.88); }
  .checkbox svg { width: 24px; height: 24px; }
  .trash-btn {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    padding: 6px;
    background: transparent; border: none;
    cursor: pointer; opacity: .4;
    display: grid; place-items: center;
    transition: transform .1s ease;
  }
  .trash-btn svg { width: 22px; height: 22px; }
  .trash-btn:active { transform: scale(.88); }
  .confirm-btns { display: flex; gap: 7px; flex: 0 0 auto; align-items: center; }
  .confirm-yes, .confirm-no {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 18px;
    padding: 7px 14px;
    cursor: pointer;
    border: 2px solid;
    background: transparent;
    border-radius: 255px 8px 225px 8px / 8px 225px 8px 255px;
  }
  .confirm-yes { color: #c0392b; border-color: #c0392b; }
  .confirm-no  { color: var(--ink-soft); border-color: var(--dash); }
  .group-sep {
    list-style: none;
    margin: 22px 0 6px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--ink-soft);
    border-bottom: 2px solid var(--done);
    padding-bottom: 3px;
  }
  .empty { padding: 26px 4px; font-size: 18px; color: var(--ink-soft); }

  /* ---------- recurring ---------- */
  .rec-list { list-style: none; margin: 4px 0 0; padding: 0; }
  .rec-task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 2px;
    border-bottom: 2px dotted var(--line);
  }
  .rec-task:last-child { border-bottom: none; }
  .rec-body { flex: 1; min-width: 0; }
  .rec-name { font-size: 20px; line-height: 1.2; }
  .rec-badge {
    display: inline-block;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 14px;
    padding: 2px 9px;
    border: 1.8px solid;
    border-radius: 255px 6px 225px 6px / 6px 225px 6px 255px;
    letter-spacing: .4px;
    margin-top: 4px;
  }
  .rec-badge.due       { color: var(--due);  border-color: var(--due); }
  .rec-badge.done-t    { color: var(--done); border-color: var(--done); }
  .rec-badge.not-today { color: #b4b1a6;     border-color: #d5d2c9; }
  .rec-tick {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    padding: 0;
    background: transparent;
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .1s ease;
  }
  .rec-tick:active:not(:disabled) { transform: scale(.88); }
  .rec-tick:disabled { opacity: .3; }
  .rec-tick svg { width: 24px; height: 24px; }
  .rec-trash {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    padding: 5px;
    background: transparent; border: none;
    cursor: pointer; opacity: .4;
    display: grid; place-items: center;
  }
  .rec-trash svg { width: 18px; height: 18px; }
  .rec-trash:active { transform: scale(.88); }

  /* frequency dropdown (drops upward in the bottom bar) */
  .ink-drop { position: relative; flex: none; }
  .ink-drop-trigger {
    font-family: 'Patrick Hand', cursive;
    font-size: 17px;
    color: var(--ink);
    background: transparent;
    border: 2.2px solid var(--ink);
    border-radius: 255px 10px 225px 12px / 12px 225px 12px 255px;
    padding: 0 12px;
    height: 46px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .drop-caret { font-size: 11px; color: var(--ink-soft); transition: transform .15s ease; }
  .ink-drop.open .drop-caret { transform: rotate(180deg); }
  .ink-drop-menu {
    position: absolute;
    bottom: calc(100% + 7px);
    right: 0;
    min-width: 150px;
    background: var(--paper);
    list-style: none;
    margin: 0; padding: 5px 0;
    z-index: 100;
    display: none;
    border: 2.2px solid var(--ink);
    border-radius: 4px 18px 4px 18px / 18px 4px 18px 4px;
    box-shadow: 3px 4px 0 rgba(43,43,40,0.12);
  }
  .ink-drop.open .ink-drop-menu { display: block; }
  .ink-drop-menu button {
    font-family: 'Patrick Hand', cursive;
    font-size: 18px;
    color: var(--ink);
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
    padding: 10px 16px;
    cursor: pointer;
  }
  .ink-drop-menu button:active { background: rgba(43,43,40,0.07); }
  .ink-drop-menu button.active { font-family: 'Caveat', cursive; font-weight: 700; }

  /* ---------- calendar ---------- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 2px 0 14px;
  }
  .cal-month {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 26px;
    background: transparent;
    border: none;
    color: var(--ink);
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 255px 9px 225px 9px / 9px 225px 9px 255px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .cal-month:active { background: rgba(43,43,40,0.06); }
  .cal-month .mini-caret { font-size: 13px; color: var(--ink-soft); }
  .cal-nav-btn {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 26px;
    background: transparent; border: none;
    cursor: pointer; color: var(--ink);
    width: 44px; height: 44px;
    display: grid; place-items: center;
  }
  .cal-nav-btn:active { transform: scale(.85); }
  .cal-dow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 7px;
  }
  .cal-dow span {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-cell {
    aspect-ratio: 1 / 1;
    border: 2px solid transparent;
    border-radius: 255px 9px 225px 9px / 9px 225px 9px 255px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    transition: background .12s ease;
  }
  .cal-cell.blank { cursor: default; }
  .cal-cell.has:not(.selected) { background: rgba(43,43,40,0.04); }
  .cal-cell.past { color: #bdbab1; }
  .cal-cell.today { border-color: var(--due); color: var(--due); }
  .cal-cell.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cal-cell.selected.today { color: var(--paper); }
  .cal-cell:active:not(.blank) { transform: scale(.92); }
  .cal-dots { display: flex; gap: 3px; height: 7px; align-items: center; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
  .cal-dot.active { background: var(--due); }
  .cal-dot.done { background: var(--done); }
  .cal-cell.selected .cal-dot.active { background: #f0c46a; }
  .cal-cell.selected .cal-dot.done { background: #8fd3a6; }
  .cal-tip {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--ink-soft);
    text-align: center;
    margin: 22px 8px 6px;
    line-height: 1.4;
  }
  .cal-legend {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 8px;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* ---------- tab bar ---------- */
  .tabbar {
    flex: none;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--paper);
    border-top: 2.6px solid var(--ink);
    display: flex;
    z-index: 20;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--ink-soft);
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 16px;
    position: relative;
    transition: color .15s ease;
  }
  .tab svg { width: 26px; height: 26px; }
  .tab .tab-ink { stroke: var(--ink-soft); transition: stroke .15s ease; }
  .tab.active { color: var(--ink); }
  .tab.active .tab-ink { stroke: var(--ink); }
  .tab.active::after {
    content: "";
    position: absolute;
    top: 6px;
    width: 30px; height: 5px;
    background: var(--due);
    border-radius: 40% 60% 50% 50% / 60%;
  }

  /* ---------- bottom sheet ---------- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(43,43,40,0.32);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 40;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .bottom-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 520px;
    margin: 0 auto;
    background: var(--paper);
    border-top: 2.8px solid var(--ink);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -8px 24px rgba(43,43,40,0.16);
    transform: translateY(110%);
    transition: transform .3s cubic-bezier(.22,1,.36,1);
    z-index: 50;
    max-height: 78dvh;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-grab {
    width: 46px; height: 5px;
    background: #cdcabf;
    border-radius: 3px;
    margin: 10px auto 4px;
    flex: none;
  }
  .sheet-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 20px 12px;
    border-bottom: 2px solid var(--line);
  }
  .sheet-title {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 27px;
    margin: 0;
    line-height: 1;
  }
  .sheet-sub { font-size: 15px; color: var(--ink-soft); display: block; margin-top: 2px; }
  .sheet-close {
    flex: none;
    width: 40px; height: 40px;
    border: none;
    background: transparent;
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1;
  }
  .sheet-close:active { transform: scale(.85); }
  .sheet-body {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 20px 22px;
  }
  .sheet-daysep {
    list-style: none;
    margin: 16px 0 4px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 18px;
    color: var(--ink-soft);
  }
  .sheet-daysep:first-child { margin-top: 6px; }
</style>
</head>
<body>
  <div class="app">
    <div class="pages" id="pages">

      <!-- ============ PAGE 1 — TASKS ============ -->
      <section class="page" id="page-tasks">
        <header class="page-head">
          <h1 class="page-title">tasks</h1>
          <span class="counts" id="counts"></span>
        </header>
        <div class="page-scroll">
          <ul class="task-list" id="task-list"></ul>
        </div>
        <div class="page-bar">
          <div class="bar-hint" id="eta-preview"></div>
          <form class="bar-form" id="add-form">
            <input class="bar-input" id="name-input" placeholder="task name…" autocomplete="off" />
            <div class="date-wrap">
              <button class="icon-btn sketch" id="date-btn" type="button" tabindex="-1" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path class="stroke" d="M4 7 C 9 5, 15 9, 20 6 L20 19 C 15 21, 9 18, 4 20 Z" stroke-width="2" stroke-linejoin="round"/><path class="stroke" d="M8 4 L8 8 M16 5 L16 9 M4 11 H20" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="date-dot" id="date-dot"></span>
              </button>
              <input type="date" id="date-input" class="date-overlay" aria-label="set deadline" />
            </div>
            <button class="plus-btn sketch" type="submit" aria-label="add task"><span>+</span></button>
          </form>
        </div>
      </section>

      <!-- ============ PAGE 2 — RECURRING ============ -->
      <section class="page" id="page-recurring">
        <header class="page-head">
          <h1 class="page-title">recurring</h1>
        </header>
        <div class="page-scroll">
          <ul class="rec-list" id="rec-list"></ul>
        </div>
        <div class="page-bar">
          <form class="bar-form" id="rec-form">
            <input class="bar-input" id="rec-name" placeholder="habit name…" autocomplete="off" />
            <div class="ink-drop" id="freq-drop">
              <button class="ink-drop-trigger" type="button" data-value="daily">daily <span class="drop-caret">▾</span></button>
              <ul class="ink-drop-menu">
                <li><button type="button" data-dropval="daily" class="active">daily</button></li>
                <li><button type="button" data-dropval="weekdays">weekdays</button></li>
                <li><button type="button" data-dropval="weekly">weekly</button></li>
                <li><button type="button" data-dropval="monthly">monthly</button></li>
              </ul>
            </div>
            <div class="ink-drop" id="day-drop" style="display:none">
              <button class="ink-drop-trigger" type="button" data-value="1">mon <span class="drop-caret">▾</span></button>
              <ul class="ink-drop-menu">
                <li><button type="button" data-dropval="1" class="active">monday</button></li>
                <li><button type="button" data-dropval="2">tuesday</button></li>
                <li><button type="button" data-dropval="3">wednesday</button></li>
                <li><button type="button" data-dropval="4">thursday</button></li>
                <li><button type="button" data-dropval="5">friday</button></li>
                <li><button type="button" data-dropval="6">saturday</button></li>
                <li><button type="button" data-dropval="0">sunday</button></li>
              </ul>
            </div>
            <button class="plus-btn sketch" type="submit" aria-label="add habit"><span>+</span></button>
          </form>
        </div>
      </section>

      <!-- ============ PAGE 3 — CALENDAR ============ -->
      <section class="page" id="page-calendar">
        <header class="page-head">
          <h1 class="page-title">calendar</h1>
        </header>
        <div class="page-scroll">
          <div class="cal-nav">
            <button class="cal-nav-btn" id="cal-prev" type="button">←</button>
            <button class="cal-month" id="cal-month" type="button"></button>
            <button class="cal-nav-btn" id="cal-next" type="button">→</button>
          </div>
          <div class="cal-dow">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <p class="cal-tip">tap a day for its tasks · tap the month for all of them</p>
          <div class="cal-legend">
            <span><i style="background:var(--due)"></i> to do</span>
            <span><i style="background:var(--done)"></i> done</span>
          </div>
        </div>
      </section>

    </div>

    <!-- ============ TAB BAR ============ -->
    <nav class="tabbar">
      <button class="tab active" data-page="0" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path class="tab-ink" d="M4 7 C 9 5, 15 9, 20 6" stroke-width="2" stroke-linecap="round"/><path class="tab-ink" d="M4 13 C 9 11, 15 15, 20 12" stroke-width="2" stroke-linecap="round"/><path class="tab-ink" d="M4 19 C 9 17, 15 21, 20 18" stroke-width="2" stroke-linecap="round"/></svg>
        tasks
      </button>
      <button class="tab" data-page="1" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path class="tab-ink" d="M5 12 A 7 7 0 1 1 8 18" stroke-width="2" stroke-linecap="round"/><path class="tab-ink" d="M5 7 L5 12 L9 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        recurring
      </button>
      <button class="tab" data-page="2" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path class="tab-ink" d="M4 6 C 9 4, 15 8, 20 5 L20 19 C 15 22, 9 18, 4 20 Z" stroke-width="2" stroke-linejoin="round"/><path class="tab-ink" d="M8 4 L8 8 M16 5 L16 9 M4 11 H20" stroke-width="2" stroke-linecap="round"/></svg>
        calendar
      </button>
    </nav>
  </div>

  <!-- ============ BOTTOM SHEET ============ -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <header class="sheet-head">
      <h3 class="sheet-title" id="sheet-title"></h3>
      <button class="sheet-close" id="sheet-close" type="button" aria-label="close">✕</button>
    </header>
    <div class="sheet-body">
      <ul class="task-list" id="sheet-list"></ul>
    </div>
  </div>

<script src="mobile-app.js"></script>
</body>
</html>
