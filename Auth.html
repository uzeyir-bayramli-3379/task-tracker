<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Tracker — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #2b2b28;
    --ink-soft: #6f6e66;
    --paper: #f7f5ef;
    --done: #3f8f5b;
    --due: #cf8a16;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(120% 120% at 50% 0%, #fbfaf5 0%, #f1efe7 100%);
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 24px;
  }

  /* hand-drawn box */
  .sketch {
    border: 2.6px solid var(--ink);
    border-radius: 255px 14px 225px 16px / 16px 225px 18px 255px;
  }

  .card {
    width: min(430px, 100%);
    background: var(--paper);
    padding: 40px 38px 34px;
    box-shadow: 7px 9px 0 rgba(43, 43, 40, 0.10), 0 2px 0 rgba(43,43,40,0.04);
    position: relative;
  }

  .brand {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink-soft);
    letter-spacing: .4px;
    margin: 0 0 4px;
  }
  .title {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 40px;
    margin: 0 0 4px;
    line-height: 1;
  }
  .subtitle {
    font-size: 16px;
    color: var(--ink-soft);
    margin: 0 0 26px;
  }

  form { display: flex; flex-direction: column; gap: 22px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .lbl { font-size: 16px; color: var(--ink-soft); letter-spacing: .3px; }
  .ink-input {
    font-family: 'Patrick Hand', cursive;
    font-size: 19px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2.2px dashed #c7c4b8;
    padding: 4px 2px 6px;
    outline: none;
    width: 100%;
  }
  .ink-input::placeholder { color: #b4b1a6; }
  .ink-input:focus { border-bottom-color: var(--ink); border-bottom-style: solid; }

  .field.invalid .ink-input { border-bottom-color: var(--due); border-bottom-style: solid; }
  .err {
    font-family: 'Caveat', cursive;
    font-size: 17px;
    color: var(--due);
    min-height: 0;
    margin: -2px 0 0;
    display: none;
  }
  .field.invalid .err { display: block; }

  .submit {
    margin-top: 6px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 24px;
    padding: 11px 16px;
    border-width: 2.6px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    align-self: stretch;
    box-shadow: 3px 3px 0 rgba(43,43,40,0.22);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .submit:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(43,43,40,0.22); }

  .switch {
    margin: 22px 0 0;
    font-size: 17px;
    color: var(--ink-soft);
    text-align: center;
  }
  .switch button {
    font-family: 'Patrick Hand', cursive;
    font-size: 17px;
    background: transparent;
    border: none;
    color: var(--done);
    cursor: pointer;
    padding: 0 2px;
    text-decoration: underline;
    text-decoration-style: wavy;
    text-underline-offset: 3px;
  }
  .switch button:hover { color: var(--ink); }

  /* a couple of doodled corner marks for hand-drawn warmth */
  .doodle {
    position: absolute;
    pointer-events: none;
    opacity: .5;
  }
  .doodle.tr { top: -16px; right: 22px; width: 46px; height: 46px; }
  .doodle.bl { bottom: -14px; left: 26px; width: 60px; height: 22px; }

  .signedin {
    display: none;
    text-align: center;
    padding: 14px 0 4px;
  }
  .signedin.show { display: block; }
  .signedin .tick {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--done);
  }
  .signedin a {
    display: inline-block;
    margin-top: 10px;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card sketch">
      <svg class="doodle tr" viewBox="0 0 46 46" aria-hidden="true">
        <path d="M6 30 C 14 10, 30 6, 40 14" fill="none" stroke="var(--due)" stroke-width="2.4" stroke-linecap="round" />
        <path d="M40 14 L 34 12 M40 14 L 38 20" fill="none" stroke="var(--due)" stroke-width="2.4" stroke-linecap="round" />
      </svg>

      <p class="brand">task tracker</p>
      <h1 class="title" id="title">welcome back</h1>
      <p class="subtitle" id="subtitle">log in to pick up where you left off.</p>

      <form id="form" novalidate>
        <label class="field" id="f-email">
          <span class="lbl">email</span>
          <input class="ink-input" id="email" type="email" autocomplete="email" placeholder="you@email.com" />
          <p class="err">enter a valid email.</p>
        </label>

        <label class="field" id="f-pass">
          <span class="lbl">password</span>
          <input class="ink-input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
          <p class="err">at least 6 characters.</p>
        </label>

        <button class="submit sketch" type="submit" id="submit">log in</button>
      </form>

      <div class="signedin" id="signedin">
        <p class="tick" id="tickmsg">✓ you're in!</p>
        <a href="Task Tracker.html">go to your tasks →</a>
      </div>

      <p class="switch" id="switch">
        <span id="switch-text">new here?</span>
        <button type="button" id="toggle">create an account</button>
      </p>
    </div>
  </div>

  <script>
    var mode = 'login'; // 'login' | 'signup'
    var els = {
      title: document.getElementById('title'),
      subtitle: document.getElementById('subtitle'),
      submit: document.getElementById('submit'),
      switchText: document.getElementById('switch-text'),
      toggle: document.getElementById('toggle'),
      form: document.getElementById('form'),
      email: document.getElementById('email'),
      password: document.getElementById('password'),
      fEmail: document.getElementById('f-email'),
      fPass: document.getElementById('f-pass'),
      signedin: document.getElementById('signedin'),
      tickmsg: document.getElementById('tickmsg'),
      pwInput: document.getElementById('password'),
    };

    var copy = {
      login: {
        title: 'welcome back',
        subtitle: 'log in to pick up where you left off.',
        submit: 'log in',
        switchText: 'new here?',
        toggle: 'create an account',
        autocomplete: 'current-password',
        tick: "✓ you're in!"
      },
      signup: {
        title: 'make an account',
        subtitle: 'just an email and a password — that\u2019s it.',
        submit: 'sign up',
        switchText: 'already have an account?',
        toggle: 'log in instead',
        autocomplete: 'new-password',
        tick: '✓ account created!'
      }
    };

    function render() {
      var c = copy[mode];
      els.title.textContent = c.title;
      els.subtitle.textContent = c.subtitle;
      els.submit.textContent = c.submit;
      els.switchText.textContent = c.switchText;
      els.toggle.textContent = c.toggle;
      els.pwInput.setAttribute('autocomplete', c.autocomplete);
      clearErrors();
      els.form.style.display = '';
      els.signedin.classList.remove('show');
    }

    function clearErrors() {
      els.fEmail.classList.remove('invalid');
      els.fPass.classList.remove('invalid');
    }

    els.toggle.addEventListener('click', function () {
      mode = mode === 'login' ? 'signup' : 'login';
      render();
      els.email.focus();
    });

    [els.email, els.password].forEach(function (inp) {
      inp.addEventListener('input', clearErrors);
    });

    els.form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors();
      var ok = true;
      var emailVal = els.email.value.trim();
      var passVal = els.password.value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
        els.fEmail.classList.add('invalid');
        ok = false;
      }
      if (passVal.length < 6) {
        els.fPass.classList.add('invalid');
        ok = false;
      }
      if (!ok) return;

      // success — front-end only (no backend wired up)
      els.tickmsg.textContent = copy[mode].tick;
      els.form.style.display = 'none';
      els.signedin.classList.add('show');
    });

    render();
    els.email.focus();
  </script>
</body>
</html>
